<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla de Formulario - Registro e Inicio de Sesión</title>
    <style>
        :root {
            --fondo-pagina: #AC84FF; /* Cambia este color o pon url('imagen.jpg') */
            --color-tarjeta: #ABCFF1;
        }

        body {
            background: var(--fondo-pagina);
            font-family: sans-serif;
            margin: 0;
            padding: 40px 20px;
            
            /* Centrado del formulario en pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        form {
            background-color: var(--color-tarjeta);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border-radius: 8px;
        }

        /* Espaciado simple para no encimar elementos */
        div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        fieldset {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 15px;
        }
    </style>
</head>
<body>

    <form action="#" method="POST" enctype="multipart/form-data">
        <h2>INICIO DE SESION&nbsp;</h2>

        <fieldset>
          <legend>Información Personal</legend>

            

            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="usuario@dominio.com" required>
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div>
                <label for="telefono">Numero de&nbsp; Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="123-456-7890">
            </div>

           

           
        </fieldset>

        <fieldset>
            <legend>Fechas y Tiempo</legend>

            <div>
                <label for="nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="nacimiento" name="nacimiento">
            </div>

            <div>
               
            </div>
        </fieldset>

      <fieldset>
            <legend>selecina tu ciudad/pais&nbsp; &nbsp;&nbsp;</legend>

            
           
                

            
                
        

            
        </fieldset>

        <fieldset>
            <legend>Contenido&nbsp; de perfil&nbsp;</legend>

            <div>
              <label for="avatar">Subir Foto de Perfil / Avatar:</label>
                <input type="file" id="avatar" name="avatar" accept="image/*">
            </div>

            <div>
               
            </div>

            
                

            
                
     

</body>
</html>
