<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla de Formulario - Registro e Inicio de Sesión</title>
    <style>
        :root {
            --fondo-pagina: #f0f2f5; /* Cambia este color o pon url('imagen.jpg') */
            --color-tarjeta: #ffffff;
        }

        body {
            background: var(--fondo-pagina);
            font-family: sans-serif;
            margin: 0;
            padding: 40px 20px;
            
            /* Centrado del formulario en pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        form {
            background-color: var(--color-tarjeta);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border-radius: 8px;
        }

        /* Espaciado simple para no encimar elementos */
        div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        fieldset {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 15px;
        }
    </style>
</head>
<body>

    <form action="#" method="POST" enctype="multipart/form-data">
        <h2>Registro</h2>

        <fieldset>
          <legend>Información Personal</legend>

            
               
            <div>
                
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div>
                
            </div>

            <div>
                <label for="sitio-web">Sitio Web / Portafolio (URL):</label>
                <input type="url" id="sitio-web" name="sitio-web" placeholder="https://miportafolio.com">
            </div>

            
      </fieldset>

        <fieldset>
            <legend>Fechas y Tiempo</legend>

            

            <div>
                <label for="hora">Hora preferida de contacto:</label>
                <input type="time" id="hora" name="hora">
            </div>
        </fieldset>

        <fieldset>
            <legend>Preferencias y Opciones</legend>

            <div>
                <p><strong>Nivel de Experiencia (Radio):</strong></p>
                <input type="radio" id="principiante" name="experiencia" value="principiante" checked>
                <label for="principiante" style="display:inline;">Principiante</label><br>
                
                <input type="radio" id="intermedio" name="experiencia" value="intermedio">
                <label for="intermedio" style="display:inline;">Intermedio</label><br>
                
                <input type="radio" id="avanzado" name="experiencia" value="avanzado">
                <label for="avanzado" style="display:inline;">Avanzado</label>
            </div>

            <div>
                <p><strong>Intereses (Checkbox):</strong></p>
                <input type="checkbox" id="ui" name="intereses" value="ui">
                <label for="ui" style="display:inline;">Diseño UI</label><br>

                <input type="checkbox" id="ux" name="intereses" value="ux">
                <label for="ux" style="display:inline;">Investigación UX</label><br>

                <input type="checkbox" id="branding" name="intereses" value="branding">
                <label for="branding" style="display:inline;">Branding</label>
            </div>

            <div>
                <label for="pais">País (Desplegable / Select):</label>
                <select id="pais" name="pais">
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="mx">México</option>
                    <option value="es">España</option>
                    <option value="co">Colombia</option>
                    <option value="ar">Argentina</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <legend>Contenido y Archivos</legend>

            <div>
                <label for="avatar">Subir Foto de Perfil / Avatar:</label>
                <input type="file" id="avatar" name="avatar" accept="image/*">
            </div>

            <div>
                <label for="color-favorito">Color de Marca (Selector de Color):</label>
                <input type="color" id="color-favorito" name="color-favorito" value="#3b82f6">
            </div>

            <div>
                <label for="satisfaccion">Nivel de Satisfacción (Rango):</label>
                <input type="range" id="satisfaccion" name="satisfaccion" min="0" max="100" value="50">
            </div>

            <div>
                <label for="biografia">Semblanza / Bio (Área de Texto):</label>
                <textarea id="biografia" name="biografia" rows="4" placeholder="Escribe una breve presentación..."></textarea>
            </div>
        </fieldset>

        <div>
            <input type="hidden" name="origen_registro" value="landing_page_2026">

            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos" style="display:inline;">Acepto los términos y condiciones</label>
        </div>

        <div>
            <input type="submit" value="Crear Cuenta">
            
            <input type="reset" value="Restablecer Campos">
            
            <button type="button">Botón Genérico</button>
        </div>
</form>

</body>
</html>
